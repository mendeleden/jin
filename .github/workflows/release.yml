name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: jin-linux-x64
            smoke_test: true
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: jin-linux-arm64
            smoke_test: false
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: jin-darwin-arm64
            smoke_test: true
          # Cross-compile darwin-x64 from macOS ARM (macos-13 is deprecated)
          - os: macos-latest
            target: bun-darwin-x64
            artifact: jin-darwin-x64
            smoke_test: false
          - os: windows-latest
            target: bun-windows-x64
            artifact: jin-windows-x64.exe
            smoke_test: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - run: bun install

      - name: Build binary
        run: bun build ./src/index.ts --compile --target=${{ matrix.target }} --outfile ${{ matrix.artifact }}

      - name: Smoke test binary
        if: matrix.smoke_test && runner.os != 'Windows'
        run: ./${{ matrix.artifact }} version && ./${{ matrix.artifact }} --help

      - name: Smoke test binary (Windows)
        if: matrix.smoke_test && runner.os == 'Windows'
        run: .\${{ matrix.artifact }} version && .\${{ matrix.artifact }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: binaries
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x binaries/*

      - name: Generate checksums
        run: cd binaries && sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: binaries/*
          generate_release_notes: true
