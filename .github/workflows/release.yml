name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"
          no-cache: true

      - run: bun install

      - name: Run typecheck
        run: bun run typecheck

      - name: Run release-gate lifecycle tests
        run: bun run test:release-gates

      - name: Build acceptance binary
        run: bun build ./src/index.ts --compile --outfile jin

      - name: Run acceptance test
        run: bun run test/acceptance/verify.ts ./jin

  build-cli:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: jin-linux-x64
            smoke_test: true
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: jin-linux-arm64
            smoke_test: false
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: jin-darwin-arm64
            smoke_test: true
          - os: macos-latest
            target: bun-darwin-x64
            artifact: jin-darwin-x64
            smoke_test: false
          - os: windows-latest
            target: bun-windows-x64
            artifact: jin-windows-x64.exe
            smoke_test: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"
          no-cache: true

      - run: bun install

      - name: Build CLI binary
        run: bun build ./src/index.ts --compile --target=${{ matrix.target }} --outfile ${{ matrix.artifact }}

      - name: Smoke test CLI binary
        if: matrix.smoke_test && runner.os != 'Windows'
        run: ./${{ matrix.artifact }} version && ./${{ matrix.artifact }} --help

      - name: Smoke test CLI binary (Windows)
        if: matrix.smoke_test && runner.os == 'Windows'
        run: .\${{ matrix.artifact }} version; .\${{ matrix.artifact }} --help

      - name: Upload CLI artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: cli-${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-latest
            target: darwin-x64
          - os: windows-latest
            target: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"
          no-cache: true

      - run: bun install

      - name: Validate Desktop command and renderer
        run: bun test test/desktop-command.test.ts test/desktop-renderer.test.ts test/desktop-shell-service.test.ts test/desktop-home-route.test.ts test/cli-surface-cleanup.test.ts

      - name: Typecheck Desktop
        run: bun run desktop:typecheck

      - name: Build Desktop renderer
        run: bun run desktop:build

      - name: Package Desktop
        run: bun run scripts/package-desktop.ts --target=${{ matrix.target }}

      - name: Upload Desktop artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: desktop-${{ matrix.target }}
          path: release-artifacts/jin-desktop-*

  release:
    needs: [build-cli, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Make Unix CLI binaries executable
        run: find release-assets -type f \( -name 'jin-linux-*' -o -name 'jin-darwin-*' \) -exec chmod +x {} +

      - name: Generate checksums
        run: cd release-assets && sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: release-assets/*
          generate_release_notes: true
