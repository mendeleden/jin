name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: jin-linux-x64
            smoke_test: true
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: jin-linux-arm64
            smoke_test: false
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: jin-darwin-arm64
            smoke_test: true
          # Cross-compile darwin-x64 from macOS ARM (macos-13 is deprecated)
          - os: macos-latest
            target: bun-darwin-x64
            artifact: jin-darwin-x64
            smoke_test: false
          - os: windows-latest
            target: bun-windows-x64
            artifact: jin-windows-x64.exe
            smoke_test: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - run: bun install

      - name: Build dashboard
        run: cd dashboard && bun install && bun run build

      - name: Embed dashboard in source
        run: bun run scripts/embed-spa.ts

      - name: Build binary
        run: bun build ./src/index.ts --compile --target=${{ matrix.target }} --outfile ${{ matrix.artifact }}

      - name: Smoke test binary
        if: matrix.smoke_test && runner.os != 'Windows'
        run: ./${{ matrix.artifact }} version && ./${{ matrix.artifact }} --help

      - name: Smoke test binary (Windows)
        if: matrix.smoke_test && runner.os == 'Windows'
        run: .\${{ matrix.artifact }} version && .\${{ matrix.artifact }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: binaries
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x binaries/*

      - name: Generate checksums
        run: cd binaries && sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: binaries/*
          generate_release_notes: true
