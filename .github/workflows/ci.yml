name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"
          no-cache: true

      - run: bun install

      - name: Run typecheck
        run: bun run typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"
          no-cache: true

      - run: bun install

      - name: Run unit tests
        run: >-
          bun test
          test/cli-surface-cleanup.test.ts
          test/config.test.ts
          test/config-mutation-control.test.ts
          test/connect.test.ts
          test/daemon-query-boundary.test.ts
          test/db-store-spine.test.ts
          test/desktop-command.test.ts
          test/desktop-home-route.test.ts
          test/desktop-renderer.test.ts
          test/desktop-shell-service.test.ts
          test/pipeline-spec-gap-closure.test.ts
          test/progress.test.ts
          test/routing.test.ts
          test/self-observation.test.ts
          test/team-bootstrap.test.ts

  lifecycle-validation:
    needs: [typecheck]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"
          no-cache: true

      - run: bun install

      - name: Run release-gate lifecycle tests
        run: bun run test:release-gates

  acceptance:
    needs: [typecheck, test, lifecycle-validation]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"
          no-cache: true

      - run: bun install

      - name: Build binary
        run: bun build ./src/index.ts --compile --outfile jin

      - name: Run acceptance test
        run: bun run test/acceptance/verify.ts ./jin
        if: runner.os != 'Windows'

      - name: Run acceptance test (Windows)
        run: bun run test/acceptance/verify.ts .\jin.exe
        if: runner.os == 'Windows'

  binary-smoke:
    needs: [typecheck, test]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"
          no-cache: true

      - run: bun install

      - name: Build binary
        run: bun build ./src/index.ts --compile --outfile jin
        if: runner.os != 'Windows'

      - name: Build binary (Windows)
        run: bun build ./src/index.ts --compile --outfile jin.exe
        if: runner.os == 'Windows'

      - name: Smoke test binary
        run: ./jin version && ./jin --help
        if: runner.os != 'Windows'

      - name: Smoke test binary (Windows)
        run: .\jin.exe version; .\jin.exe --help
        if: runner.os == 'Windows'

  desktop-package:
    needs: [typecheck, test]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-latest
            target: darwin-x64
          - os: windows-latest
            target: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"
          no-cache: true

      - run: bun install

      - name: Typecheck Desktop
        run: bun run desktop:typecheck

      - name: Build Desktop renderer
        run: bun run desktop:build

      - name: Package Desktop
        run: bun run scripts/package-desktop.ts --target=${{ matrix.target }}

      - name: Upload Desktop package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: desktop-${{ matrix.target }}
          path: release-artifacts/jin-desktop-*

  integration:
    needs: [typecheck, test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"
          no-cache: true

      - run: bun install

      - name: Start Postgres
        run: docker compose -f test/docker-compose.integration.yml up -d --wait postgres
        timeout-minutes: 2

      - name: Run integration tests
        run: bun test test/persona-local-postgres.test.ts

      - name: Service logs (on failure)
        if: failure()
        run: docker compose -f test/docker-compose.integration.yml logs postgres

      - name: Tear down services
        if: always()
        run: docker compose -f test/docker-compose.integration.yml down -v
