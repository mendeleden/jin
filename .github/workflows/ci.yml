name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - run: bun install

      # bun test has no --ignore flag; list unit test files explicitly
      # (integration.test.ts needs Docker, acceptance/ runs as a separate job)
      - name: Run unit tests
        run: bun test test/connect.test.ts test/init.test.ts test/progress.test.ts test/routing.test.ts test/search.test.ts test/self-observation.test.ts

  # Full acceptance test: build binary → seed data → jin init → jin start → verify
  # Simulates a real user installing and running jin on each platform
  acceptance:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - run: bun install

      - name: Embed dashboard placeholder
        run: bun run scripts/embed-spa.ts

      - name: Build binary
        run: bun build ./src/index.ts --compile --outfile jin

      - name: Run acceptance test
        run: bun run test/acceptance/verify.ts ./jin
        if: runner.os != 'Windows'

      - name: Run acceptance test (Windows)
        run: bun run test/acceptance/verify.ts .\jin.exe
        if: runner.os == 'Windows'

  # Integration tests with real Postgres + S3 (Linux only — needs Docker)
  # Uses docker-compose (not GHA services) because MinIO needs command: server /data
  # Runs on PRs targeting main + pushes to main (not feature branch pushes)
  integration:
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - run: bun install

      - name: Start Postgres + MinIO
        run: docker compose -f test/docker-compose.integration.yml up -d --wait
        timeout-minutes: 2

      - name: Run integration tests
        run: bun test test/integration.test.ts

      - name: Service logs (on failure)
        if: failure()
        run: docker compose -f test/docker-compose.integration.yml logs

      - name: Tear down services
        if: always()
        run: docker compose -f test/docker-compose.integration.yml down -v
